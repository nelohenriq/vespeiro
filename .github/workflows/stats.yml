name: Daily Stats & Alert

on:
  schedule:
    # Generate stats and send Jornal do Contra briefing at 09:00 UTC daily
    - cron: '0 9 * * *'

  workflow_dispatch:
    inputs:
      skip_telegram:
        description: 'Skip Telegram alert (stats only)'
        required: false
        default: 'false'
      send_test:
        description: 'Send Telegram test message instead of daily briefing'
        required: false
        default: 'false'

jobs:
  # ── Job 1: Warm the embedding cache ─────────────────────────────────────────
  # Pre-embed all articles from the last 7 days so that generate-stats
  # benefits from cache hits instead of re-encoding everything from scratch.
  # This runs as a separate job so its artifacts (cached embeddings) are
  # available to subsequent jobs via a dedicated cache artifact.
  warm-cache:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite+aiosqlite:///data/vespeiro.db"
      VESPERO_EMBED_CACHE: "${{ github.workspace }}/data/embedding-cache"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache NLP models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/spacy
            ~/.cache/huggingface
            ~/.cache/torch
          key: nlp-models-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -e . -q
          python -m spacy download pt_core_news_lg 2>/dev/null || true

      # ── Restore previously cached embeddings if any ─────────────────────
      - name: Restore embedding cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: data/embedding-cache/
          key: embed-cache-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}

      - name: Pre-warm embedding cache
        run: |
          mkdir -p data/embedding-cache/
          echo "Cache entries before warm-up: $(ls data/embedding-cache/ 2>/dev/null | wc -l)"
          cd backend
          python -c "
          import asyncio, sys
          from src.db.session import create_engine_and_session
          from src.pipeline.embedder import warm_embed_cache

          async def main():
              engine, session_factory = create_engine_and_session('${{ env.DATABASE_URL }}')
              async with engine.begin() as conn:
                  from src.db.models import Base
                  await conn.run_sync(Base.metadata.create_all)
              session = session_factory()
              try:
                  count = await warm_embed_cache(session, window_days=7)
                  print(f'Cache warm-up: {count} new entries added')
              finally:
                  await session.close()
                  await engine.dispose()
          asyncio.run(main())
          " 2>&1 || echo "Cache warm-up completed (or skipped)"

      - name: Upload embedding cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: embedding-cache
          path: data/embedding-cache/
          retention-days: 7

      - name: Write step summary
        run: |
          echo "## 🧠 Cache Warm-Up" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Embedding cache pre-populated with articles from the last 7 days." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Files: $(find data/embedding-cache/ -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 2: Generate stats.json ─────────────────────────────────────────────
  # Depends on warm-cache so it gets the pre-populated embedding cache.
  # All heavy ML operations (Lusa, Silence, Gap) reuse cached embeddings.
  generate-stats:
    runs-on: ubuntu-latest
    needs: warm-cache

    env:
      DATABASE_URL: "sqlite+aiosqlite:///data/vespeiro.db"
      VESPERO_EMBED_CACHE: "${{ github.workspace }}/data/embedding-cache"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache NLP models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/spacy
            ~/.cache/huggingface
            ~/.cache/torch
          key: nlp-models-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -e . -q
          python -m spacy download pt_core_news_lg 2>/dev/null || true

      - name: Restore embedding cache artifact
        uses: actions/cache/restore@v4
        with:
          path: data/embedding-cache/
          key: embed-cache-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          fail-on-cache-miss: false

      # ── Restore divergence reports artifact from latest analysis workflow
      - name: Restore divergence reports
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: analyze.yml
          name: divergence-reports
          path: reports/divergence/
          if_no_artifact_found: warn
          check_artifacts: false

      - name: Generate stats.json
        id: stats
        run: |
          mkdir -p data/embedding-cache/
          echo "=== Embedding cache state ==="
          echo "Cache files: $(find data/embedding-cache/ -type f | wc -l)"
          echo "Cache dir exists: $(test -d data/embedding-cache && echo YES || echo NO)"
          echo ""
          cd backend
          python run_stats.py --reports-dir ../reports/divergence --output ../frontend/public/stats.json 2>&1

      - name: Verify stats.json
        run: |
          if [ ! -f frontend/public/stats.json ]; then
            echo "❌ stats.json not generated!"
            exit 1
          fi
          SIZE=$(wc -c < frontend/public/stats.json)
          echo "✅ stats.json: $SIZE bytes"
          python -c "
          import json, sys
          d = json.load(open('frontend/public/stats.json'))
          print(f\"Generated: {d['generated_at']}\")
          print(f\"Sources: {d['sources']['active']}/{d['sources']['total']} active\")
          print(f\"Articles: {d['sources']['articles_total']} total\")
          lusa = d.get('lusa_dependency', {}).get('global_pct')
          print(f\"Lusa dependency: {lusa}%\" if lusa is not None else 'Lusa dependency: N/A')
          div = d.get('divergence', {}).get('global_avg')
          print(f\"Divergence avg: {div:.1%}\" if div is not None else 'Divergence avg: N/A')
          "

      - name: Upload stats.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-stats
          path: frontend/public/stats.json
          retention-days: 1

      - name: Commit stats.json to repo
        run: |
          git config user.name "vespeiro-bot"
          git config user.email "bot@vespeiro.pt"
          git add frontend/public/stats.json
          if git diff --staged --quiet; then
            echo "📄 No changes to stats.json — skipping commit"
          else
            git commit -m "chore: daily stats update [skip ci]"
            git push
            echo "✅ stats.json committed and pushed"
          fi

      - name: Write step summary
        if: always()
        run: |
          echo "## 📊 Stats Generation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f frontend/public/stats.json ]; then
            echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| stats.json | ✅ generated |" >> "$GITHUB_STEP_SUMMARY"
            SIZE=$(wc -c < frontend/public/stats.json)
            echo "| Size | $SIZE bytes |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| stats.json | ❌ failed |" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Job 3: Send Telegram briefing ───────────────────────────────────────────
  # Only runs after generate-stats has completed successfully.
  # Can be skipped via workflow_dispatch input.
  send-telegram:
    runs-on: ubuntu-latest
    needs: generate-stats

    env:
      DATABASE_URL: "sqlite+aiosqlite:///data/vespeiro.db"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e . -q

      - name: Download stats.json
        uses: actions/download-artifact@v4
        with:
          name: generated-stats
          path: frontend/public/
          if_no_artifact_found: warn

      - name: Send Telegram test message
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true' && env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          cd backend && python run_alert.py --test

      - name: Send daily Telegram briefing
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_telegram != 'true')) && env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          cd backend && python run_alert.py --daily --stats-path ../frontend/public/stats.json 2>&1

      - name: Write step summary
        if: always()
        run: |
          echo "## 📱 Telegram Alert" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f frontend/public/stats.json ]; then
            echo "✅ Briefing prepared and sent" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ stats.json not available — briefing skipped" >> "$GITHUB_STEP_SUMMARY"
          fi