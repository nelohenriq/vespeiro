name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_args:
        description: 'Extra pytest arguments (e.g. "-k test_silence")'
        required: false
        default: ''
      skip_model_cache:
        description: 'Skip NLP model cache restore'
        type: boolean
        required: false
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "sqlite+aiosqlite:///data/vespeiro.db"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Cache NLP models
        if: ${{ github.event.inputs.skip_model_cache != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/spacy
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/pysentimiento
          key: nlp-models-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            nlp-models-${{ runner.os }}-

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          python -m spacy download pt_core_news_lg 2>/dev/null || true
          python -m spacy download en_core_web_lg 2>/dev/null || true

      - name: Ensure test database exists
        run: |
          if [ ! -f backend/data/vespeiro.db ]; then
            touch backend/data/vespeiro.db
            echo "Created placeholder DB at backend/data/vespeiro.db"
          fi

      - name: Run tests
        id: test
        run: |
          cd backend
          ARGS="${{ github.event.inputs.test_args || '' }}"
          python -m pytest tests/ \
            -v \
            --tb=short \
            $ARGS \
            2>&1 | tee ../test-output.txt
        # If pytest fails, we still want to parse results — the step outcome
        # is captured by ${{ steps.test.outcome }} which GHA sets automatically.

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 14

      - name: Write GHA Summary
        if: always()
        run: |
          {
            echo '## 🧪 Test Results'
            echo ''
            echo '| Metric | Value |'
            echo '|--------|-------|'
            if [ -f test-output.txt ]; then
              TOTAL=$(grep -oP '\d+(?= passed)' test-output.txt | tail -1)
              FAIL=$(grep -oP '\d+(?= failed)' test-output.txt | tail -1)
              echo "| Total | ${TOTAL:-?} passed, ${FAIL:-0} failed |"
              echo "| Outcome | ${{ steps.test.outcome }} |"
              if [ "${FAIL:-0}" -gt 0 ]; then
                echo ''
                echo '### ❌ Failed tests'
                grep -E 'FAILED' test-output.txt | head -20
              else
                echo '| Status | ✅ ALL PASSED |'
              fi
            else
              echo '| Tests | ❌ no output captured |'
            fi
            echo ''
            echo '### ⚙️ Configuration'
            echo "- Python 3.12 · trigger: ${{ github.event_name }}"
            echo "- NLP cache: ${{ github.event.inputs.skip_model_cache == 'true' && 'skipped' || 'enabled' }}"
          } >> "$GITHUB_STEP_SUMMARY"
